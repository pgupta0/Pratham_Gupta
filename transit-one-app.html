<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0A2A3D"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Transit One — Mobile App</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --ink:#0A2A3D; --ink2:#0D3550; --paper:#FAFAF7; --paper-dim:#F1F1EC;
  --line-light:#E3E3DC; --navy:#0D5079; --navy-dark:#0A3D5C;
  --green:#4DA57B; --green-dark:#388963; --gold:#C99A3E;
  --danger:#D64545; --amber:#C4841A; --sky:#3B82F6;
  --accent:var(--navy); --accent-dark:var(--navy-dark);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:'IBM Plex Sans',system-ui,sans-serif;background:#0A2A3D;color:var(--ink);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:0;height:0}

/* ============ DEVICE FRAME (desktop preview) ============ */
.t1-stage{
  min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(900px 500px at 15% 10%, rgba(13,80,121,.55), transparent 60%),
    radial-gradient(800px 480px at 85% 85%, rgba(77,165,123,.35), transparent 60%),
    #071F2D;
}
.t1-stage-side{max-width:330px;color:#fff;margin-right:56px}
.t1-stage-side h1{font-family:'Space Grotesk',sans-serif;font-size:32px;line-height:1.15;margin:18px 0 12px;letter-spacing:-.02em}
.t1-stage-side p{font-size:13.5px;line-height:1.7;color:rgba(255,255,255,.65);margin:0 0 22px}
.t1-stage-side ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
.t1-stage-side li{font-size:12.5px;color:rgba(255,255,255,.72);display:flex;gap:9px;align-items:flex-start}
.t1-stage-side li i{color:var(--green);font-style:normal}
.t1-phone{
  width:392px;height:840px;max-height:calc(100dvh - 48px);background:var(--paper);border-radius:44px;
  position:relative;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 11px #0d1b24,0 0 0 13px #24333d;
  display:flex;flex-direction:column;
}
.t1-notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:27px;background:#0d1b24;border-radius:0 0 18px 18px;z-index:90}
@media (max-width:900px){
  .t1-stage{padding:0;display:block;background:var(--paper)}
  .t1-stage-side{display:none}
  .t1-phone{width:100%;height:100dvh;max-height:none;border-radius:0;box-shadow:none}
  .t1-notch{display:none}
}

/* ============ APP SHELL ============ */
.t1-app{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;background:var(--paper)}
.t1-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.t1-pad-b{height:calc(84px + var(--safe-b))}

/* header */
.t1-hdr{
  position:sticky;top:0;z-index:40;background:rgba(250,250,247,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-light);padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 12px;
  display:flex;align-items:center;gap:12px;
}
.t1-hdr.dark{background:linear-gradient(180deg,#0A2A3D,#0D3550);border-bottom-color:rgba(255,255,255,.09)}
.t1-hdr-logo{height:24px;width:auto;display:block}
.t1-hdr-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;letter-spacing:-.01em}
.t1-hdr.dark .t1-hdr-title{color:#fff}
.t1-hdr-sub{font-size:11px;color:#74808A;margin-top:1px}
.t1-hdr.dark .t1-hdr-sub{color:rgba(255,255,255,.55)}
.t1-hdr-spacer{flex:1}
.t1-iconbtn{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:15px;
  border:1px solid var(--line-light);background:#fff;position:relative;flex-shrink:0;
}
.t1-hdr.dark .t1-iconbtn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16);color:#fff}
.t1-dot{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;font-family:'IBM Plex Mono',monospace}
.t1-back{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:#fff;border:1px solid var(--line-light);flex-shrink:0}

/* ============ BOTTOM TAB BAR ============ */
.t1-tabs{
  position:absolute;left:0;right:0;bottom:0;z-index:60;display:flex;
  background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line-light);
  padding:9px 6px calc(9px + var(--safe-b));
}
.t1-tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 2px;border-radius:12px;position:relative}
.t1-tab-ic{font-size:19px;line-height:1;transition:transform .25s cubic-bezier(.34,1.56,.64,1);color:#93A0A9}
.t1-tab-lb{font-size:9.5px;font-weight:600;color:#93A0A9;letter-spacing:.01em}
.t1-tab.on .t1-tab-ic{color:var(--accent);transform:translateY(-2px) scale(1.12)}
.t1-tab.on .t1-tab-lb{color:var(--accent)}
.t1-tab.on::before{content:'';position:absolute;top:-1px;width:22px;height:3px;border-radius:0 0 4px 4px;background:var(--accent)}

/* ============ SCREEN TRANSITIONS ============ */
.t1-screen{animation:scrIn .34s cubic-bezier(.22,1,.36,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.t1-screen-pop{animation:popIn .3s cubic-bezier(.22,1,.36,1)}
@keyframes popIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
.stg{opacity:0;animation:stgIn .5s cubic-bezier(.22,1,.36,1) forwards}
@keyframes stgIn{to{opacity:1;transform:none}}
.stg{transform:translateY(12px)}

/* ============ SPLASH ============ */
.t1-splash{
  position:absolute;inset:0;z-index:200;display:grid;place-items:center;
  background:linear-gradient(160deg,#0A2A3D,#0D5079 60%,#12688F);
  animation:splashOut .5s ease .2s forwards;
}
.t1-splash.hide{pointer-events:none}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
.t1-splash-in{text-align:center;animation:splashPop .7s cubic-bezier(.22,1,.36,1)}
@keyframes splashPop{0%{opacity:0;transform:scale(.86)}60%{opacity:1}100%{opacity:1;transform:none}}
.t1-splash img{height:38px;filter:drop-shadow(0 6px 20px rgba(0,0,0,.3))}
.t1-splash p{color:rgba(255,255,255,.7);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;margin:16px 0 0}
.t1-splash-road{margin:26px auto 0;width:130px;height:3px;border-radius:9px;background:rgba(255,255,255,.16);overflow:hidden}
.t1-splash-road i{display:block;height:100%;width:40%;border-radius:9px;background:var(--green);animation:road 1.4s ease-in-out infinite}
@keyframes road{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}

/* ============ HOME ============ */
.t1-hero{position:relative;padding:calc(env(safe-area-inset-top,0px) + 26px) 18px 26px;background:linear-gradient(165deg,#0A2A3D 0%,#0D5079 78%,#14648E 100%);color:#fff;overflow:hidden}
.t1-hero::after{content:'';position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(77,165,123,.35),transparent 68%);top:-110px;right:-90px}
.t1-hero-in{position:relative;z-index:2}
.t1-chipline{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:6px 12px;font-size:10.5px;font-family:'IBM Plex Mono',monospace;letter-spacing:.09em;text-transform:uppercase;margin-bottom:16px}
.t1-chipline i{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulseDot 1.8s infinite}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(77,165,123,.7)}50%{box-shadow:0 0 0 6px rgba(77,165,123,0)}}
.t1-hero h1{font-family:'Space Grotesk',sans-serif;font-size:29px;line-height:1.14;letter-spacing:-.025em;margin:0 0 10px}
.t1-hero h1 em{font-style:normal;color:#7FD3A6}
.t1-hero p{font-size:13.5px;line-height:1.6;color:rgba(255,255,255,.75);margin:0 0 18px}
.t1-hero-cta{display:flex;gap:9px}

/* search pill */
.t1-searchpill{
  margin:-19px 18px 0;position:relative;z-index:5;background:#fff;border:1px solid var(--line-light);
  border-radius:15px;padding:13px 15px;display:flex;align-items:center;gap:10px;
  box-shadow:0 12px 30px rgba(10,42,61,.14);font-size:13.5px;color:#8C98A2;
}
.t1-searchpill b{color:var(--ink);font-weight:600}

.t1-sec{padding:24px 18px 0}
.t1-sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:13px}
.t1-sec-h h2{font-family:'Space Grotesk',sans-serif;font-size:17px;letter-spacing:-.015em;margin:0}
.t1-sec-h button{font-size:12px;font-weight:600;color:var(--accent)}
.t1-sec-sub{font-size:12.5px;color:#74808A;margin:-8px 0 14px;line-height:1.55}

/* quick actions */
.t1-qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.t1-qa-card{background:#fff;border:1px solid var(--line-light);border-radius:15px;padding:14px;text-align:left;transition:transform .16s ease,box-shadow .16s ease}
.t1-qa-card:active{transform:scale(.975);box-shadow:0 6px 18px rgba(10,42,61,.1)}
.t1-qa-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:16px;margin-bottom:10px;background:#E9F1F6;color:var(--navy)}
.t1-qa-ic.g{background:#E7F4ED;color:var(--green-dark)}
.t1-qa-ic.o{background:#FAF1DF;color:#9A7526}
.t1-qa-ic.p{background:#EDEFF2;color:#4A5866}
.t1-qa-card h3{font-family:'Space Grotesk',sans-serif;font-size:13.5px;margin:0 0 3px}
.t1-qa-card p{font-size:11px;color:#8C98A2;margin:0;line-height:1.45}

/* category rail */
.t1-rail{display:flex;gap:11px;overflow-x:auto;padding:2px 18px 4px;margin:0 -18px;scroll-snap-type:x mandatory}
.t1-rail::-webkit-scrollbar{display:none}
.t1-cat{flex:0 0 158px;scroll-snap-align:start;border-radius:15px;overflow:hidden;background:#fff;border:1px solid var(--line-light);text-align:left}
.t1-cat-art{height:100px;position:relative;overflow:hidden;background:#EAF1F6}
.t1-cat-art svg{width:100%;height:100%;display:block}
.t1-cat-b{padding:10px 12px 12px}
.t1-cat-b h4{font-size:12.5px;margin:0 0 2px;font-family:'Space Grotesk',sans-serif}
.t1-cat-b p{font-size:10.5px;color:#8C98A2;margin:0;line-height:1.4}

/* stats strip */
.t1-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-light);border:1px solid var(--line-light);border-radius:15px;overflow:hidden}
.t1-stat{background:#fff;padding:14px 14px}
.t1-stat b{display:block;font-family:'Space Grotesk',sans-serif;font-size:20px;color:var(--navy)}
.t1-stat span{font-size:10.5px;color:#8C98A2}

/* trust rows */
.t1-trust{background:#fff;border:1px solid var(--line-light);border-radius:15px;overflow:hidden}
.t1-trust-row{display:flex;gap:12px;padding:14px;border-bottom:1px solid var(--line-light)}
.t1-trust-row:last-child{border-bottom:0}
.t1-trust-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#E7F4ED;color:var(--green-dark);font-size:14px;flex-shrink:0}
.t1-trust-row h4{font-size:13px;margin:0 0 3px;font-family:'Space Grotesk',sans-serif}
.t1-trust-row p{font-size:11.5px;color:#74808A;margin:0;line-height:1.5}

/* testimonial */
.t1-quote{background:linear-gradient(155deg,#0A2A3D,#0D5079);border-radius:17px;padding:20px;color:#fff;position:relative;overflow:hidden}
.t1-quote::after{content:'"';position:absolute;font-family:'Space Grotesk',sans-serif;font-size:120px;color:rgba(255,255,255,.07);top:-30px;right:8px;line-height:1}
.t1-quote p{font-size:13.5px;line-height:1.65;margin:0 0 16px;position:relative;z-index:2}
.t1-quote-by{display:flex;align-items:center;gap:10px;position:relative;z-index:2}
.t1-quote-av{width:34px;height:34px;border-radius:50%;background:var(--green);color:#08202E;display:grid;place-items:center;font-weight:700;font-size:12px;font-family:'Space Grotesk',sans-serif}
.t1-quote-by b{font-size:12.5px;display:block}
.t1-quote-by span{font-size:10.5px;color:rgba(255,255,255,.6)}

/* ============ BUTTONS ============ */
.t1-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:13px;
  font-weight:600;font-size:14px;padding:13px 18px;transition:transform .14s ease,filter .14s ease;
  background:var(--accent);color:#fff;
}
.t1-btn:active{transform:scale(.97)}
.t1-btn:disabled{opacity:.45}
.t1-btn.ghost{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff}
.t1-btn.out{background:#fff;border:1.5px solid var(--line-light);color:var(--ink)}
.t1-btn.green{background:var(--green)}
.t1-btn.sm{padding:9px 14px;font-size:12.5px;border-radius:11px}
.t1-btn.full{width:100%}
.t1-btn.lg{padding:15px 20px;font-size:15px;border-radius:15px}

/* ============ MARKETPLACE ============ */
.t1-searchbar{padding:12px 18px 10px;background:var(--paper);position:sticky;top:0;z-index:30}
.t1-input{
  width:100%;border:1.5px solid var(--line-light);background:#fff;border-radius:13px;padding:12px 14px;font-size:14px;
  transition:border-color .16s ease,box-shadow .16s ease;
}
.t1-input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 13%,transparent)}
.t1-filters{display:flex;gap:8px;overflow-x:auto;padding:2px 18px 12px;margin:0 -18px}
.t1-filters::-webkit-scrollbar{display:none}
.t1-fchip{
  flex:0 0 auto;border:1px solid var(--line-light);background:#fff;border-radius:99px;padding:8px 14px;
  font-size:12px;font-weight:600;color:#5D6B76;transition:all .16s ease;
}
.t1-fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.t1-pcard{background:#fff;border:1px solid var(--line-light);border-radius:16px;overflow:hidden;margin-bottom:12px;transition:transform .16s ease,box-shadow .16s ease}
.t1-pcard:active{transform:scale(.985);box-shadow:0 8px 22px rgba(10,42,61,.1)}
.t1-pcard-art{height:134px;position:relative;background:#EAF1F6;overflow:hidden}
.t1-pcard-art svg,.t1-pcard-art img{width:100%;height:100%;object-fit:cover;display:block}
.t1-pcard-badge{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.95);border-radius:99px;padding:5px 10px;font-size:10px;font-weight:700;color:var(--green-dark);display:flex;align-items:center;gap:5px}
.t1-pcard-badge i{width:5px;height:5px;border-radius:50%;background:var(--green);font-style:normal}
.t1-pcard-b{padding:13px 14px 14px}
.t1-pcard-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:9px}
.t1-pcard-logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;font-family:'Space Grotesk',sans-serif;flex-shrink:0}
.t1-pcard-top h3{font-size:14px;margin:0 0 2px;font-family:'Space Grotesk',sans-serif}
.t1-pcard-top p{font-size:11px;color:#8C98A2;margin:0}
.t1-pcard-rate{margin-left:auto;text-align:right;flex-shrink:0}
.t1-pcard-rate b{font-size:13px;font-family:'Space Grotesk',sans-serif;color:var(--gold)}
.t1-pcard-rate span{display:block;font-size:10px;color:#8C98A2}
.t1-tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.t1-tag{font-size:10px;font-weight:600;padding:4px 8px;border-radius:6px;background:var(--paper-dim);color:#5D6B76}
.t1-pcard-stats{display:flex;gap:14px;padding-top:11px;border-top:1px solid var(--line-light)}
.t1-pcard-stat b{display:block;font-size:12.5px;font-family:'Space Grotesk',sans-serif}
.t1-pcard-stat span{font-size:9.5px;color:#8C98A2}

/* ============ CONTACT ============ */
.t1-seg{display:flex;background:var(--paper-dim);border-radius:13px;padding:4px;gap:4px;margin-bottom:18px}
.t1-seg button{flex:1;padding:10px 8px;border-radius:10px;font-size:12.5px;font-weight:600;color:#5D6B76;transition:all .22s cubic-bezier(.22,1,.36,1)}
.t1-seg button.on{background:#fff;color:var(--accent);box-shadow:0 2px 8px rgba(10,42,61,.09)}
.t1-field{display:block;margin-bottom:13px}
.t1-field span{display:block;font-size:12px;font-weight:600;color:#3D4A56;margin-bottom:6px}
.t1-ta{min-height:96px;resize:vertical}
.t1-contactcard{background:#fff;border:1px solid var(--line-light);border-radius:16px;padding:16px;margin-bottom:12px}
.t1-cline{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-light)}
.t1-cline:last-child{border-bottom:0;padding-bottom:0}
.t1-cline:first-child{padding-top:0}
.t1-cline-ic{width:32px;height:32px;border-radius:10px;background:#E9F1F6;color:var(--navy);display:grid;place-items:center;font-size:14px;flex-shrink:0}
.t1-cline b{font-size:12.5px;display:block;margin-bottom:2px}
.t1-cline a,.t1-cline p{font-size:12px;color:#74808A;margin:0;line-height:1.55}
.t1-cline a{color:var(--accent);font-weight:600}
.t1-mapbox{height:120px;border-radius:14px;background:linear-gradient(135deg,#E9F1F6,#DCE8F0);border:1px solid var(--line-light);position:relative;overflow:hidden;margin-bottom:12px;display:grid;place-items:center}
.t1-mapgrid{position:absolute;inset:0;background-image:linear-gradient(rgba(13,80,121,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(13,80,121,.09) 1px,transparent 1px);background-size:26px 26px}
.t1-mappin{position:relative;z-index:2;text-align:center}
.t1-mappin i{font-size:26px;font-style:normal;filter:drop-shadow(0 4px 8px rgba(10,42,61,.25));display:block;animation:pinBob 2.4s ease-in-out infinite}
@keyframes pinBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.t1-mappin span{font-size:11px;font-weight:700;color:var(--navy);display:block;margin-top:4px}

/* ============ LOGIN ============ */
.t1-login{position:relative;min-height:100%;display:flex;flex-direction:column;background:linear-gradient(168deg,#0A2A3D,#0D5079 65%,#14648E);overflow:hidden}
.t1-login.fleet{background:linear-gradient(168deg,#0C3326,#2E7A5B 62%,#4DA57B)}
.t1-login-orb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(2px)}
.t1-login-orb.a{width:250px;height:250px;background:radial-gradient(circle,rgba(77,165,123,.4),transparent 68%);top:-70px;right:-70px;animation:orbA 9s ease-in-out infinite}
.t1-login-orb.b{width:210px;height:210px;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 68%);bottom:130px;left:-80px;animation:orbB 11s ease-in-out infinite}
@keyframes orbA{0%,100%{transform:translate(0,0)}50%{transform:translate(-22px,26px)}}
@keyframes orbB{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,-22px)}}
.t1-login-top{padding:calc(env(safe-area-inset-top,0px) + 20px) 22px 0;position:relative;z-index:3}
.t1-login-hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 22px;position:relative;z-index:3;color:#fff}
.t1-login-hero h1{font-family:'Space Grotesk',sans-serif;font-size:28px;line-height:1.16;letter-spacing:-.025em;margin:14px 0 9px}
.t1-login-hero p{font-size:13.5px;color:rgba(255,255,255,.7);line-height:1.6;margin:0}
.t1-login-role{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);border-radius:99px;padding:7px 13px;font-size:10.5px;font-family:'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase}
.t1-sheet{
  background:var(--paper);border-radius:26px 26px 0 0;padding:24px 22px calc(24px + var(--safe-b));
  position:relative;z-index:4;box-shadow:0 -14px 40px rgba(0,0,0,.24);animation:sheetUp .46s cubic-bezier(.22,1,.36,1);
}
@keyframes sheetUp{from{transform:translateY(60px);opacity:.5}to{transform:none;opacity:1}}
.t1-sheet-grab{width:38px;height:4px;border-radius:9px;background:var(--line-light);margin:0 auto 18px}
.t1-otp{display:flex;gap:9px;justify-content:space-between;margin-bottom:16px}
.t1-otp input{
  width:100%;aspect-ratio:1;text-align:center;font-size:20px;font-weight:700;font-family:'Space Grotesk',sans-serif;
  border:1.5px solid var(--line-light);border-radius:13px;background:#fff;
}
.t1-otp input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 13%,transparent)}
.t1-rolepick{display:flex;flex-direction:column;gap:11px}
.t1-rolecard{
  display:flex;align-items:center;gap:13px;padding:16px;border-radius:17px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.18);text-align:left;color:#fff;transition:transform .16s ease,background .16s ease;
}
.t1-rolecard:active{transform:scale(.98)}
.t1-rolecard-ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex-shrink:0;background:rgba(255,255,255,.14)}
.t1-rolecard h3{font-family:'Space Grotesk',sans-serif;font-size:15px;margin:0 0 3px}
.t1-rolecard p{font-size:11.5px;color:rgba(255,255,255,.65);margin:0;line-height:1.45}
.t1-rolecard-go{margin-left:auto;font-size:18px;opacity:.6}

/* success tick */
.t1-tick{width:74px;height:74px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:0 auto 18px;animation:tickPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes tickPop{0%{transform:scale(0)}100%{transform:scale(1)}}
.t1-tick svg{width:34px;height:34px}
.t1-tick path{stroke-dasharray:40;stroke-dashoffset:40;animation:tickDraw .45s ease .22s forwards}
@keyframes tickDraw{to{stroke-dashoffset:0}}

/* ============ DASHBOARD ============ */
.t1-dhead{padding:18px 18px 20px;background:linear-gradient(165deg,#0A2A3D,#0D5079);color:#fff;position:relative;overflow:hidden}
.t1-dhead.green{background:linear-gradient(165deg,#0C3326,#2E7A5B)}
.t1-dhead::after{content:'';position:absolute;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.13),transparent 68%);top:-90px;right:-70px}
.t1-dhead-in{position:relative;z-index:2}
.t1-dhead-eye{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.t1-dhead h1{font-family:'Space Grotesk',sans-serif;font-size:22px;margin:5px 0 3px;letter-spacing:-.02em}
.t1-dhead p{font-size:12.5px;color:rgba(255,255,255,.7);margin:0}
.t1-kpirail{display:flex;gap:10px;overflow-x:auto;padding:14px 18px 2px;margin:0 -18px 0}
.t1-kpirail::-webkit-scrollbar{display:none}
.t1-kpi{flex:0 0 116px;background:rgba(255,255,255,.11);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:12px}
.t1-kpi b{display:block;font-family:'Space Grotesk',sans-serif;font-size:19px;color:#fff}
.t1-kpi span{font-size:10px;color:rgba(255,255,255,.62);line-height:1.35;display:block;margin-top:3px}
.t1-alert{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid var(--line-light);border-radius:14px;padding:13px;margin-bottom:9px}
.t1-alert-d{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.t1-alert b{font-size:13px;display:block;margin-bottom:2px}
.t1-alert span{font-size:11.5px;color:#8C98A2}
.t1-alert-go{margin-left:auto;color:#B4BEC7;font-size:17px}
.t1-bar-row{margin-bottom:13px}
.t1-bar-lb{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;color:#5D6B76}
.t1-bar-lb b{color:var(--ink);font-family:'Space Grotesk',sans-serif}
.t1-bar-tr{height:8px;background:#EDF1F3;border-radius:99px;overflow:hidden}
.t1-bar-fl{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--navy),#3E8EB8);animation:barGrow .8s cubic-bezier(.22,1,.36,1)}
.t1-bar-fl.green{background:linear-gradient(90deg,var(--green-dark),var(--green))}
@keyframes barGrow{from{width:0!important}}

/* ============ AI CHATBOT ============ */
.t1-fab{
  position:absolute;right:16px;bottom:calc(96px + var(--safe-b));z-index:70;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(145deg,var(--accent),var(--accent-dark));color:#fff;display:grid;place-items:center;
  box-shadow:0 10px 26px rgba(10,42,61,.34);animation:fabIn .4s cubic-bezier(.34,1.56,.64,1);
}
.t1-fab:active{transform:scale(.93)}
@keyframes fabIn{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.t1-fab::before{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--accent);opacity:.35;animation:fabRing 2.2s ease-out infinite}
@keyframes fabRing{0%{transform:scale(1);opacity:.4}100%{transform:scale(1.32);opacity:0}}
.t1-fab-ic{font-size:22px}
.t1-chat{position:absolute;inset:0;z-index:120;display:flex;flex-direction:column;background:var(--paper);animation:chatUp .32s cubic-bezier(.22,1,.36,1)}
@keyframes chatUp{from{transform:translateY(100%)}to{transform:none}}
.t1-chat-hd{padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 13px;background:linear-gradient(150deg,#0A2A3D,#0D5079);color:#fff;display:flex;align-items:center;gap:11px}
.t1-chat-hd.green{background:linear-gradient(150deg,#0C3326,#2E7A5B)}
.t1-chat-av{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:17px;position:relative}
.t1-chat-av i{position:absolute;bottom:-1px;right:-1px;width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid #0D5079}
.t1-chat-hd b{font-size:14px;display:block;font-family:'Space Grotesk',sans-serif}
.t1-chat-hd span{font-size:10.5px;color:rgba(255,255,255,.62)}
.t1-chat-body{flex:1;overflow-y:auto;padding:16px}
.t1-msg{max-width:82%;padding:11px 14px;border-radius:16px;font-size:13px;line-height:1.55;margin-bottom:10px;animation:msgIn .3s cubic-bezier(.22,1,.36,1)}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.t1-msg.bot{background:#fff;border:1px solid var(--line-light);border-bottom-left-radius:5px}
.t1-msg.me{background:var(--accent);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.t1-msg-acts{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.t1-msg-act{background:#fff;border:1px solid var(--line-light);border-radius:11px;padding:10px 12px;font-size:12px;font-weight:600;text-align:left;display:flex;align-items:center;gap:9px;color:var(--accent)}
.t1-msg-act:active{background:var(--paper-dim)}
.t1-typing{display:flex;gap:4px;padding:13px 15px;background:#fff;border:1px solid var(--line-light);border-radius:16px;border-bottom-left-radius:5px;width:fit-content}
.t1-typing i{width:6px;height:6px;border-radius:50%;background:#B4BEC7;animation:typ 1.3s infinite}
.t1-typing i:nth-child(2){animation-delay:.18s}
.t1-typing i:nth-child(3){animation-delay:.36s}
@keyframes typ{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}
.t1-chat-sug{display:flex;gap:7px;overflow-x:auto;padding:10px 16px;border-top:1px solid var(--line-light);background:#fff}
.t1-chat-sug::-webkit-scrollbar{display:none}
.t1-chat-sug button{flex:0 0 auto;border:1px solid var(--line-light);border-radius:99px;padding:8px 13px;font-size:11.5px;font-weight:600;color:#5D6B76;background:var(--paper)}
.t1-chat-in{display:flex;gap:9px;padding:11px 16px calc(11px + var(--safe-b));background:#fff;border-top:1px solid var(--line-light)}
.t1-chat-in input{flex:1;border:1.5px solid var(--line-light);border-radius:99px;padding:11px 16px;font-size:13.5px;background:var(--paper)}
.t1-chat-in input:focus{outline:0;border-color:var(--accent)}
.t1-chat-send{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:16px;flex-shrink:0}

/* misc */
.t1-toast{position:absolute;left:16px;right:16px;bottom:calc(100px + var(--safe-b));z-index:150;background:var(--ink);color:#fff;border-radius:13px;padding:13px 15px;font-size:12.5px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.3);animation:tIn .3s cubic-bezier(.22,1,.36,1)}
@keyframes tIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.t1-toast i{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.t1-note{background:#E9F1F6;border:1px solid #CFE0EA;border-radius:13px;padding:13px;font-size:12px;color:#2C5871;line-height:1.6}
.t1-divider{height:1px;background:var(--line-light);margin:18px 0}

}

   ============================================================ */
function Chat({ role, onClose, go, toast }) {
  const mode = role==="fleet"?"fleet":"corporate";
  const cfg = window.BOT[mode];
  const [msgs,setMsgs]=useState([{who:"bot",text:cfg.greet,acts:[]}]);
  const [val,setVal]=useState(""); const [typing,setTyping]=useState(false);
  const endRef=useRef();
  useEffect(()=>{ endRef.current && endRef.current.scrollIntoView({behavior:"smooth"}); },[msgs,typing]);

  const send=(text)=>{
    const t=(text||val).trim(); if(!t) return;
    setMsgs(m=>[...m,{who:"me",text:t}]); setVal(""); setTyping(true);
    setTimeout(()=>{
      const r=window.botReply(t,mode);
      setTyping(false);
      setMsgs(m=>[...m,{who:"bot",text:r.text,acts:r.acts}]);
    },700+Math.random()*400);
  };
  const resolveAct=(label,target)=>{
    const l=String(label||"").toLowerCase();
    if(mode==="corporate"){
      if(l.includes("start an rfq")) return "req-new";
      if(l.includes("open bid comparison")) return "compare-bids";
      if(l.includes("review the invoice")) return "invoice:INV-ML-0842";
      if(l.includes("manage plan")||l.includes("subscription")) return "subscription";
      if(l.includes("see performance")) return "home";
    } else {
      if(l.includes("view opportunities")) return "opportunities";
      if(l.includes("build a quote")) return "quote-new:RFQ-2026-0151";
      if(l.includes("fix compliance")) return "compliance";
      if(l.includes("open commissions")||l.includes("commission")) return "commissions";
      if(l.includes("see settlements")) return "settlements";
    }
    return target==="dash"?"home":target;
  };
  const runAct=(target,label)=>{ const dest=resolveAct(label,target); onClose(); go(dest); };
  const fmt=(s)=>{
    const parts=String(s).split(/\*\*(.+?)\*\*/g);
    return parts.map((p,i)=> i%2 ? h("b",{key:i},p) : p);
  };

  return h("div",{className:"t1-chat"},
    h("div",{className:"t1-chat-hd"+(mode==="fleet"?" green":"")},
      h("div",{className:"t1-chat-av"},"✦",h("i")),
      h("div",null,h("b",null,"Transit Assistant"),h("span",null,"Online · answers in seconds")),
      h("div",{style:{flex:1}}),
      h("button",{className:"t1-iconbtn",style:{background:"rgba(255,255,255,.14)",borderColor:"rgba(255,255,255,.2)",color:"#fff"},onClick:onClose},"✕")),

    h("div",{className:"t1-chat-body"},
      msgs.map((m,i)=>h("div",{key:i},
        h("div",{className:"t1-msg "+(m.who==="me"?"me":"bot")},fmt(m.text),
          m.acts && m.acts.length>0 && h("div",{className:"t1-msg-acts"},
            m.acts.map((a,j)=>h("button",{key:j,className:"t1-msg-act",onClick:()=>runAct(a[1],a[0])},
              h("span",null,"→"),a[0])))))),
      typing && h("div",{className:"t1-typing"},h("i"),h("i"),h("i")),
      h("div",{ref:endRef})),

    h("div",{className:"t1-chat-sug"},
      cfg.suggest.map((s,i)=>h("button",{key:i,onClick:()=>send(s)},s))),

    h("div",{className:"t1-chat-in"},
      h("input",{value:val,placeholder:"Ask anything…",
        onChange:e=>setVal(e.target.value),
        onKeyDown:e=>{ if(e.key==="Enter") send(); }}),
      h("button",{className:"t1-chat-send",onClick:()=>send()},"↑")));
}

  const onSubscriptionUpgrade=(data)=>setSubscription(v=>Object.assign({},v,data));
  const onCommissionReview=(id,status)=>setCommissionReviews(v=>Object.assign({},v,{[id]:status}));

  useEffect(()=>{ const t=setTimeout(()=>setSplash(false),1700); return ()=>clearTimeout(t); },[]);
  const toast=(m)=>{ setToastMsg(m); setTimeout(()=>setToastMsg(null),2400); };
  const current=()=>stack||tab;
  const topTabs=new Set(["home","market","help"]);
  const publicRoutes=(d)=>d==="home"||d==="market"||d==="help"||d==="login"||d.startsWith("provider:");
  const businessRoutes=(d)=>d==="requirements"||d==="req-new"||d==="rfq-detail"||d==="compare-bids"||d==="contracts"||d==="operations"||d==="incident"||d==="invoices"||d==="subscription"||d==="profile"||d.startsWith("subscription-checkout:")||d.startsWith("subscription-success:")||d.startsWith("req-overview:")||d.startsWith("bid:")||d.startsWith("award:")||d.startsWith("award-success:")||d.startsWith("awarded-contract:")||d.startsWith("contract:")||d.startsWith("service-request:")||d.startsWith("service:")||d.startsWith("invoice:")||d.startsWith("direct-quote:");
  const providerRoutes=(d)=>d==="opportunities"||d==="quotes"||d==="pcontracts"||d==="dispatch"||d==="provider-incident"||d==="fleet"||d==="drivers"||d==="compliance"||d==="pinvoices"||d==="settlements"||d==="commissions"||d==="profile"||d.startsWith("commission:")||d.startsWith("commission-review:")||d.startsWith("driver:")||d.startsWith("opportunity:")||d.startsWith("quote-new:")||d.startsWith("quote:")||d.startsWith("pcontract:")||d.startsWith("allocate:")||d.startsWith("pservice:")||d.startsWith("vehicle:")||d.startsWith("vehicle-renewal:")||d.startsWith("driver-doc:")||d.startsWith("app-review-vehicle:")||d.startsWith("app-review-driver:")||d.startsWith("pinvoice:")||d.startsWith("create-invoice:");
  const normalise=(dest)=>{
    if(dest==="dash") return auth?"home":"login";
    if(!auth && !publicRoutes(dest)) return "login";
    if(auth==="corp" && providerRoutes(dest) && dest!=="profile") return "home";
    if(auth==="fleet" && businessRoutes(dest) && dest!=="profile") return "home";
    return dest;
  };
  const applyRoute=(dest)=>{
    if(topTabs.has(dest)){ setStack(null); setTab(dest); }
    else setStack(dest);
    if(scrollRef.current) scrollRef.current.scrollTop=0;
  };
  const go=(rawDest,mode="push")=>{
    const dest=normalise(rawDest);
    const from=current();
    if(mode==="root") historyRef.current=[];
    else if(mode!=="replace" && dest!==from) historyRef.current.push(from);
    else if(mode==="replace"){
      while(historyRef.current.length && historyRef.current[historyRef.current.length-1]===dest) historyRef.current.pop();
    }
    applyRoute(dest);
  };
  const replace=(dest)=>go(dest,"replace");
  const goRoot=(dest)=>go(dest,"root");
  const goBack=()=>{
    const from=current();
    let dest=null;
    while(historyRef.current.length && !dest){
      const candidate=normalise(historyRef.current.pop());
      if(candidate!==from) dest=candidate;
    }
    applyRoute(dest || "home");
  };
  useEffect(()=>{ if(scrollRef.current) scrollRef.current.scrollTop=0; },[tab,stack]);

  const accent=auth==="fleet"?"var(--green)":"var(--navy)";
  const accentDark=auth==="fleet"?"var(--green-dark)":"var(--navy-dark)";
  const arg=(prefix)=>stack&&stack.startsWith(prefix+":")?stack.slice(prefix.length+1):null;

  let body,showTabs=true,showHdr=true,hdrProps={};
  if(stack==="login"){
    body=h(Login,{go,goBack,onDone:(r)=>{setAuth(r);historyRef.current=[];setStack(null);setTab("home");toast(r==="fleet"?"Signed in — MetroRide Mobility":"Signed in — Acme Technologies");}});
    showTabs=false;showHdr=false;
  } else if(stack&&stack.startsWith("provider:")){
    body=h(Provider,{id:arg("provider"),go,goBack,toast,auth,origin:historyRef.current[historyRef.current.length-1]||null});showHdr=false;
  } else if(!stack&&tab==="home"){
    body=auth?h(AuthHome,{role:auth,go,notificationItems:pendingNotifications(auth,{rfqAward,invoiceStatuses,incidentResolved,quoteStatuses,driverStatuses,vehicleCompliance,tripSheetSubmitted})}):h(Home,{go,toast});showHdr=false;
  } else if(!stack&&tab==="market"){
    body=h(Market,{go});hdrProps={back:true,title:"Marketplace",sub:"94 verified Transport Providers",onBack:goBack};
  } else if(!stack&&tab==="help"){
    body=h(HelpSupport,{toast});hdrProps={back:true,title:"Help & Support",sub:"Transit One platform support",onBack:goBack};
  } else if(stack==="notifications"){
    body=h(NotificationsMobile,{role:auth,go,rfqAward,invoiceStatuses,incidentResolved,quoteStatuses,driverStatuses,vehicleCompliance,tripSheetSubmitted});
    hdrProps={back:true,title:"Notifications",sub:"Items that need your attention",onBack:goBack};
  } else if(stack==="account-settings"){
    body=h(AccountSettingsMobile,{role:auth,replace,toast});
    hdrProps={back:true,title:"Account Settings",sub:"Profile & notification preferences",onBack:goBack};
  } else {
    hdrProps={back:true,title:auth==="fleet"?"Transport Provider":"Business",sub:"Transit One workspace",onBack:goBack};
    if(stack==="requirements") body=h(BusinessRequirements,{go,rfqAward});
    else if(stack==="req-new") body=h(RequirementNew,{go,replace,toast});
    else if(stack&&stack.startsWith("req-overview:")) body=h(RequirementOverviewMobile,{requirementRef:arg("req-overview"),go,toast});
    else if(stack==="rfq-detail") body=h(RfqDetailMobile,{go,rfqAward});
    else if(stack&&stack.startsWith("bid:")) body=h(BidDetailMobile,{id:arg("bid"),go,toast,rfqAward,revisionRequests,onRevisionRequest});
    else if(stack==="compare-bids") body=h(CompareBidsMobile,{go,toast,rfqAward,revisionRequests,onRevisionRequest});
    else if(stack&&stack.startsWith("award-success:")) body=h(AwardSuccessMobile,{id:arg("award-success"),go,replace});
    else if(stack&&stack.startsWith("award:")) body=h(AwardMobile,{id:arg("award"),go,replace,onAward:setRfqAward});
    else if(stack&&stack.startsWith("awarded-contract:")) body=h(AwardedContractMobile,{id:arg("awarded-contract"),go});
    else if(stack==="contracts") body=h(ContractsMobile,{go,rfqAward});
    else if(stack&&stack.startsWith("contract:")) body=h(ContractDetailMobile,{id:arg("contract"),go});
    else if(stack&&stack.startsWith("service-request:")) body=h(ServiceRequestMobile,{id:arg("service-request"),go,replace,toast});
    else if(stack==="operations") body=h(OperationsMobile,{go,serviceStatuses});
    else if(stack&&stack.startsWith("service:")) body=h(ServiceDetailMobile,{id:arg("service"),go,toast,providerMode:false,serviceStatuses,onStatus:onServiceStatus});
    else if(stack==="incident") body=h(IncidentMobile,{go,toast,providerMode:false,resolved:incidentResolved,onResolve:onResolveIncident});
    else if(stack==="invoices") body=h(BusinessInvoicesMobile,{go,invoiceStatuses});
    else if(stack&&stack.startsWith("invoice:")) body=h(BusinessInvoiceDetailMobile,{id:arg("invoice"),go,toast,invoiceStatuses,onInvoiceStatus,tripSheetSubmitted});
    else if(stack&&stack.startsWith("direct-quote:")) body=h(DirectQuoteMobile,{id:arg("direct-quote"),go,replace,toast});
    else if(stack==="subscription") body=h(SubscriptionMobile,{go,subscription,toast});
    else if(stack&&stack.startsWith("subscription-checkout:")) body=h(SubscriptionCheckoutMobile,{planId:arg("subscription-checkout"),replace,toast,onUpgrade:onSubscriptionUpgrade});
    else if(stack&&stack.startsWith("subscription-success:")) body=h(SubscriptionSuccessMobile,{planId:arg("subscription-success"),subscription,replace});
    else if(stack==="opportunities") body=h(OpportunitiesMobile,{go,opportunityStatuses});
    else if(stack&&stack.startsWith("opportunity:")) body=h(OpportunityDetailMobile,{id:arg("opportunity"),go,toast,opportunityStatuses,onOpportunityStatus});
    else if(stack&&stack.startsWith("quote-new:")) body=h(QuoteBuilderMobile,{id:arg("quote-new"),go,replace,toast,onOpportunityStatus,onQuoteStatus});
    else if(stack==="quotes") body=h(QuotesMobile,{go,quoteStatuses});
    else if(stack&&stack.startsWith("quote:")) body=h(QuoteDetailMobile,{id:arg("quote"),go,toast,quoteStatuses});
    else if(stack==="pcontracts") body=h(ProviderContractsMobile,{go});
    else if(stack&&stack.startsWith("pcontract:")) body=h(ProviderContractDetailMobile,{id:arg("pcontract"),go,allocatedContracts,providerInvoiceStatuses});
    else if(stack&&stack.startsWith("allocate:")) body=h(AllocateMobile,{id:arg("allocate"),go,replace,toast,onAllocated,vehicleCompliance,driverStatuses});
    else if(stack==="dispatch") body=h(DispatchMobile,{go,serviceStatuses});
    else if(stack&&stack.startsWith("pservice:")) body=h(ServiceDetailMobile,{id:arg("pservice"),go,toast,providerMode:true,serviceStatuses,onStatus:onServiceStatus});
    else if(stack==="provider-incident") body=h(IncidentMobile,{go,toast,providerMode:true,resolved:incidentResolved,onResolve:onResolveIncident});
    else if(stack==="fleet") body=h(FleetMobile,{go,vehicleCompliance});
    else if(stack&&stack.startsWith("vehicle:")) body=h(VehicleMobile,{reg:arg("vehicle"),vehicleCompliance,go});
    else if(stack&&stack.startsWith("vehicle-renewal:")) body=h(VehicleRenewalMobile,{reg:arg("vehicle-renewal"),vehicleCompliance,vehicleDocs,onVehicleDocsSubmit,go,toast});
    else if(stack==="drivers") body=h(DriversMobile,{go,driverStatuses});
    else if(stack==="compliance") body=h(ComplianceMobile,{go,driverStatuses,vehicleCompliance});
    else if(stack&&stack.startsWith("driver:")) body=h(DriverMobile,{id:arg("driver"),driverStatuses,go});
    else if(stack&&stack.startsWith("driver-doc:")) body=h(DriverDocumentMobile,{id:arg("driver-doc"),driverStatuses,driverDocs,onDriverDocsSubmit,go,toast});
    else if(stack&&stack.startsWith("app-review-vehicle:")) body=h(AppTeamReviewMobile,{kind:"vehicle",id:arg("app-review-vehicle"),vehicleDocs,driverDocs,onVehicleDocReview,onDriverDocReview,replace,toast});
    else if(stack&&stack.startsWith("app-review-driver:")) body=h(AppTeamReviewMobile,{kind:"driver",id:arg("app-review-driver"),vehicleDocs,driverDocs,onVehicleDocReview,onDriverDocReview,replace,toast});
    else if(stack==="pinvoices") body=h(ProviderInvoicesMobile,{go,providerInvoiceStatuses});
    else if(stack&&stack.startsWith("pinvoice:")) body=h(ProviderInvoiceDetailMobile,{id:arg("pinvoice"),go,providerInvoiceStatuses,onProviderInvoiceStatus,tripSheetSubmitted,onTripSheetSubmitted,toast});
    else if(stack&&stack.startsWith("create-invoice:")) body=h(CreateInvoiceMobile,{id:arg("create-invoice"),go,goBack,toast,onProviderInvoiceStatus});
    else if(stack==="commissions") body=h(CommissionsMobile,{go,commissionReviews});
    else if(stack&&stack.startsWith("commission-review:")) body=h(CommissionReviewMobile,{id:arg("commission-review"),replace,toast,onCommissionReview});
    else if(stack&&stack.startsWith("commission:")) body=h(CommissionDetailMobile,{id:arg("commission"),go,toast,commissionReviews});
    else if(stack==="settlements") body=h(SettlementsMobile,{go});
    else if(stack==="profile") body=h(ProfileMobile,{role:auth,go,goRoot,onSwitchPortal:()=>{setAuth(null);historyRef.current=[];setTab("home");setStack("login");},toast});
    else { body=h(AuthHome,{role:auth||"corp",go,notificationItems:[]});showHdr=false; }
  }

  const tabs=auth?[["home","⌂","Home"],["market","▤","Market"],["help","?","Help"]]:[["home","⌂","Home"],["market","▤","Market"],["help","?","Help"],["login","◈","Sign in"]];
  const noticeCount=auth?pendingNotifications(auth,{rfqAward,invoiceStatuses,incidentResolved,quoteStatuses,driverStatuses,vehicleCompliance,tripSheetSubmitted}).length:0;
  const noticeButton=auth?h("button",{className:"t1-iconbtn",onClick:()=>go("notifications")},"🔔",noticeCount>0&&h("span",{className:"t1-dot"},String(noticeCount))):null;
  return h("div",{className:"t1-stage"},
    h("div",{className:"t1-stage-side"},
      h("img",{src:window.T1_LOGO_LIGHT_URI,alt:"Transit One",style:{height:30}}),
      h("h1",null,"The Transit One mobile app"),
      h("p",null,"Browse verified Transport Providers, raise requirements and manage passenger transport — with an AI assistant built into both workspaces."),
      h("ul",null,[
        ["Home & marketplace open to everyone — no sign-up"],
        ["Separate sign-in for Business and Transport Providers"],
        ["Help & Support routes users to the right Transit One desk"],
        ["Subscriptions and marketplace commissions are managed inside each workspace"],["AI assistant navigates the app and answers questions"]
      ].map((x,i)=>h("li",{key:i},h("i",null,"◆"),x[0])))),
    h("div",{className:"t1-phone",style:{"--accent":accent,"--accent-dark":accentDark}},
      h("div",{className:"t1-notch"}),
      splash&&h("div",{className:"t1-splash"},h("div",{className:"t1-splash-in"},h("img",{src:window.T1_LOGO_LIGHT_URI,alt:"Transit One"}),h("p",null,"B2B Mobility Marketplace"),h("div",{className:"t1-splash-road"},h("i")))),
      h("div",{className:"t1-app"},
        showHdr&&h(Hdr,Object.assign({right:noticeButton},hdrProps)),
        h("div",{className:"t1-scroll",ref:scrollRef},body),
        auth&&tab==="home"&&!stack&&!chat&&h("button",{className:"t1-fab",onClick:()=>setChat(true)},h("span",{className:"t1-fab-ic"},"✦")),
        chat&&h(Chat,{role:auth,onClose:()=>setChat(false),go,toast}),
        toastMsg&&h("div",{className:"t1-toast"},h("i"),toastMsg),
        showTabs&&h("div",{className:"t1-tabs"},tabs.map(t=>h("button",{key:t[0],className:"t1-tab"+(tab===t[0]&&!stack?" on":""),onClick:()=>goRoot(t[0])},h("span",{className:"t1-tab-ic"},t[1]),h("span",{className:"t1-tab-lb"},t[2]))))
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body></html>
